<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#040410" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>HCU LandmarkLens — ฟิลเตอร์ถ่ายรูป AI</title>
  <meta name="description" content="ถ่ายรูปกับ Landmark ใน ม.หัวเฉียวฯ แล้ว AI จะพาคุณไปโลก Sci-Fi! ใช้ฟรี ไม่ต้องสมัครสมาชิก" />

  <!-- Open Graph -->
  <meta property="og:title" content="HCU LandmarkLens" />
  <meta property="og:description" content="AI Sci-Fi Photo Filter for HCU Landmarks" />
  <meta property="og:type" content="website" />

  <!-- PWA Manifest inline -->
  <link rel="manifest" href="manifest.json" />

  <style>
    /* Critical CSS — prevent FOUC */
    body { margin: 0; background: #040410; color: #e8f0ff; font-family: sans-serif; }
    #boot-splash {
      position: fixed; inset: 0; background: #040410;
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.5s ease;
    }
    .boot-logo {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      background: linear-gradient(135deg, #00f5ff, #b24bff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>

  <!-- Boot splash (hides once JS loads) -->
  <div id="boot-splash">
    <div class="boot-logo">HCU<br>LANDMARK<span style="font-size:0.7em;">LENS</span></div>
  </div>

  <!-- Particle background -->
  <canvas id="particle-canvas"></canvas>

  <!-- App Root -->
  <div id="app">
    <header class="app-header">
      <div class="app-logo neon-flicker">HCU LandmarkLens</div>
      <div class="app-tagline">มหาวิทยาลัยหัวเฉียวเฉลิมพระเกียรติ × AI Sci-Fi</div>
      <div class="header-line"></div>
    </header>

    <div class="step-indicator" id="step-dots">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>

    <div id="content"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
  <script>
    // Hide boot splash after JS loads
    window.addEventListener('load', () => {
      const splash = document.getElementById('boot-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 500);
      }

      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/aiproj/sw.js').catch(() => {});
      }
    });
  </script>
</body>
</html>
