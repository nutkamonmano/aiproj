<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HCU LandmarkLens | AI Sci-Fi Photography</title>
  
  <!-- PWA Tags -->
  <link rel="manifest" href="/aiproj/manifest.json">
  <meta name="theme-color" content="#0a0a12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <style>
    /* Critical CSS for boot splash */
    :root { --bg: #0a0a12; --cyan: #00f5ff; }
    body, html { margin: 0; padding: 0; background: var(--bg); overflow: hidden; height: 100%; font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #boot-splash {
      position: fixed; inset: 0; background: var(--bg); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.5s ease;
    }
    .boot-logo { font-size: 3rem; margin-bottom: 20px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.1); } }
    .boot-text {
      color: var(--cyan); font-weight: bold; letter-spacing: 0.2em; font-size: 0.8rem;
      text-transform: uppercase;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      background-size: 200% 100%;
      animation: sweep 2s linear infinite;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    @keyframes sweep { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  </style>
  <script type="module" crossorigin src="/aiproj/assets/index-GDA9zHag.js"></script>
  <link rel="stylesheet" crossorigin href="/aiproj/assets/index-DMqC_Pa7.css">
</head>
<body>
  <!-- Splash screen -->
  <div id="boot-splash">
    <div class="boot-logo">🏛️</div>
    <div class="boot-text">Initializing HCU LandmarkLens...</div>
  </div>

  <canvas id="particle-canvas"></canvas>

  <div id="app">
    <header class="app-header">
      <h1 class="app-logo">HCU LANDMARKLENS</h1>
      <p class="app-tagline">มหาวิทยาลัยหัวเฉียวเฉลิมพระเกียรติ × AI SCI-FI</p>
      <div class="header-line"></div>
    </header>

    <div id="step-dots" class="step-indicator">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>

    <div id="content"></div>
  </div>

  <script>
    // Hide boot splash after JS loads
    window.addEventListener('load', () => {
      const splash = document.getElementById('boot-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 500);
      }

      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/aiproj/sw.js').catch(() => {});
      }
    });
  </script>
</body>
</html>
